<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Incident Responder - Login</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 90%;
    max-width: 400px;
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

h1 {
    text-align: center;
    color: #2563eb;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #1e293b;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
}

input:focus {
    outline: none;
    border-color: #2563eb;
}

.login-button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

.login-button:hover {
    background: #1d4ed8;
}

.demo {
    margin-top: 20px;
    padding: 15px;
    background: #eff6ff;
    border-radius: 8px;
    color: #1e293b;
    text-align: center;
}

</style>

</head>

<body>

<div class="login-box">

    <h1>🤖 AI Incident Responder</h1>

    <p class="subtitle">
        Secure System Login
    </p>

    <label for="username">
        Username
    </label>

    <input
        type="text"
        id="username"
        placeholder="Enter username"
    >

    <label for="password">
        Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Enter password"
    >

    <button
        class="login-button"
        onclick="login()"
    >
        🔐 Login
    </button>

    <div class="demo">

        <strong>Demo Login</strong>

        <p>
            Username: <b>admin</b>
        </p>

        <p>
            Password: <b>admin123</b>
        </p>

    </div>

</div>

<script>

function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    if (username === "admin" && password === "admin123") {

        localStorage.setItem("loggedIn", "true");

        window.location.href = "dashboard.html";

    } else {

        alert("Invalid Username or Password");

    }

}

</script>

</body>

</html>
